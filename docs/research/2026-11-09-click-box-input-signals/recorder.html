<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input recorder</title>
<!--
  The input recorder of board task ab-t30.1 (docs/research/2026-11-09-click-box-input-signals.md).
  One self-contained file: no network, no library. It logs every input signal that a page script can read, with
  high-resolution timestamps, in the top page and in a cross-origin frame that stands in for a click box (a
  sandboxed srcdoc frame, or with ?box=URL a frame of another origin).

  Two uses:
  - A person (part B of the doc): open the file in Chrome, pick the device, run the tasks 1 to 7, press "Save JSON".
    The page saves one JSON file through a download. Nothing leaves the machine.
  - The probe (probe.ts): ?sink=1 sends the records to the probe's local server (navigator.sendBeacon to /log) every
    250 ms. The elements have fixed places, so the probe's X input (xdotool) can find them with no CDP. Each batch starts
    with a record {e: "seq", n, run}: n counts the batches from 0 and run is the page's ?run= label, so a gap in n shows a
    lost batch (the input harness, ab-t30.2).

  Record fields (short names keep the files small): f frame (top, box), e event type, t the event's time
  (performance.timeOrigin + event.timeStamp, epoch ms), h the handler's time (timeOrigin + performance.now()), tr
  isTrusted, tg target (#id or tag). Pointer, mouse and drag (drag, dragover): x y client, sx sy screen, mx my movement, b button, bs buttons,
  m modifiers (1 Alt, 2 Control, 4 Meta, 8 Shift), d detail, sc sourceCapabilities.firesTouchEvents, id pointerId, pt
  pointerType, ip isPrimary, pr pressure, tp tangentialPressure, w ht width height, tx ty tilt, tw twist, al az
  altitude and azimuth, nc np the counts of getCoalescedEvents() and getPredictedEvents(), co pd their points as
  [ms after t, x, y], ru the pointerrawupdate events since the last pointermove. Keys: k key, c code, kc keyCode, wh
  which, cc charCode, l location, r repeat, ic isComposing, nl cl NumLock and CapsLock states. Wheel: dx dy dz deltas,
  dm deltaMode, wdx wdy wheelDeltaX/Y. Input: it inputType, dt data. Focus: rt relatedTarget, hf document.hasFocus(),
  vs visibilityState. ua: navigator.userActivation [hasBeenActive, isActive].
-->
<style>
  :root { --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6b66; --line: #c9c9c2; --accent: #2457c5; --ok: #1d7a3a; --panel: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1b1b1a; --fg: #ecece8; --muted: #a3a39c; --line: #4a4a46; --accent: #7fa3ff; --ok: #6fd08c; --panel: #252524; }
  }
  :root[data-theme="dark"] { --bg: #1b1b1a; --fg: #ecece8; --muted: #a3a39c; --line: #4a4a46; --accent: #7fa3ff; --ok: #6fd08c; --panel: #252524; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; min-height: 2600px; position: relative; min-width: 980px; }
  #hdr { position: absolute; left: 0; top: 0; right: 0; height: 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 4px 16px;
    box-sizing: border-box; border-bottom: 1px solid var(--line); background: var(--panel); }
  #hdr b { margin-right: 6px; }
  #hdr button, #hdr select { font: inherit; padding: 2px 8px; }
  #status { color: var(--muted); }
  .abs { position: absolute; box-sizing: border-box; }
  #f { left: 40px; top: 96px; width: 360px; height: 28px; font: inherit; }
  #ta { left: 40px; top: 140px; width: 360px; height: 56px; font: inherit; }
  #b { left: 40px; top: 220px; width: 120px; height: 40px; font: inherit; }
  #hov { left: 180px; top: 220px; width: 120px; height: 40px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
  #hov #menu { display: none; position: absolute; left: 0; top: 40px; width: 120px; padding: 4px; background: var(--panel); border: 1px solid var(--line); }
  #hov:hover #menu { display: block; }
  #chkl { left: 320px; top: 230px; }
  #sel { left: 400px; top: 228px; font: inherit; }
  #file { left: 40px; top: 280px; }
  #drag { left: 40px; top: 330px; width: 100px; height: 40px; border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; cursor: grab; }
  #drop { left: 200px; top: 320px; width: 160px; height: 60px; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; }
  #box { left: 480px; top: 96px; width: 300px; height: 65px; border: 0; z-index: 2; } /* above the stage when task 1 moves it there */
  #stage { left: 40px; top: 420px; width: 900px; height: 400px; border: 1px dashed var(--line); }
  #instr { position: absolute; left: 12px; top: 8px; right: 12px; color: var(--fg); }
  #instr .sent { font-family: ui-monospace, monospace; background: var(--panel); padding: 2px 6px; border: 1px solid var(--line); }

</style>

<body>

  <b>Input recorder</b>
  <label>Device <select id="dev"><option value="">choose</option><option>trackpad</option><option>mouse</option><option>other</option></select></label>

<!-- The box: a 300 x 65 stand-in for a click box, in a frame of another origin. -->
<template id="box-html">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font: 14px system-ui, sans-serif; background: #f6f6f4; color: #1d1d1b; border: 1px solid #c9c9c2; box-sizing: border-box; position: relative; }
  #cb { position: absolute; left: 16px; top: 20px; width: 24px; height: 24px; margin: 0; }
  #lbl { position: absolute; left: 52px; top: 22px; }
  #ok { position: absolute; left: 52px; top: 22px; color: #1d7a3a; display: none; }
</style>
<input type="checkbox" id="cb" aria-label="Verify you are human"><span id="lbl">Verify you are human</span><span id="ok">Success!</span>
</template>

<script id="core">
// The recorder core: the same code runs in the top page and in the box. emit(record) takes each record.
function recCore(FRAME, emit) {
  const TO = performance.timeOrigin;
  const E = (ts) => Math.round((TO + ts) * 1000) / 1000;
  const now = () => E(performance.now());
  const tid = (t) => !t ? null : t.id ? "#" + t.id : t.nodeName ? t.nodeName.toLowerCase() : String(t);
  const mods = (e) => (e.altKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.metaKey ? 4 : 0) | (e.shiftKey ? 8 : 0);
  const r3 = (v) => typeof v === "number" ? Math.round(v * 1000) / 1000 : v;
  const ua = () => navigator.userActivation ? [navigator.userActivation.hasBeenActive ? 1 : 0, navigator.userActivation.isActive ? 1 : 0] : null;
  let raw = 0;
  const base = (e) => ({ f: FRAME, e: e.type, t: E(e.timeStamp), h: now(), tr: e.isTrusted ? 1 : 0, tg: tid(e.target) });
  const pts = (list, e) => list.map((c) => [r3(c.timeStamp - e.timeStamp), c.clientX, c.clientY]);
  function mouse(e) {
    if (e.type === "pointerrawupdate") { raw++; return; }
    const r = base(e);
    Object.assign(r, { x: e.clientX, y: e.clientY, sx: e.screenX, sy: e.screenY, mx: e.movementX, my: e.movementY, b: e.button, bs: e.buttons, m: mods(e), d: e.detail });
    if (e.sourceCapabilities !== undefined) r.sc = e.sourceCapabilities ? (e.sourceCapabilities.firesTouchEvents ? 1 : 0) : null;
    if ("pointerId" in e) {
      Object.assign(r, { id: e.pointerId, pt: e.pointerType, ip: e.isPrimary ? 1 : 0, pr: r3(e.pressure), tp: r3(e.tangentialPressure), w: r3(e.width), ht: r3(e.height),
        tx: e.tiltX, ty: e.tiltY, tw: e.twist, al: r3(e.altitudeAngle), az: r3(e.azimuthAngle) });
      if (e.type === "pointermove") {
        const co = e.getCoalescedEvents ? e.getCoalescedEvents() : null, pd = e.getPredictedEvents ? e.getPredictedEvents() : null;
        r.nc = co ? co.length : -1; r.np = pd ? pd.length : -1;
        if (co && co.length) r.co = pts(co, e);
        if (pd && pd.length) r.pd = pts(pd, e);
        r.ru = raw; raw = 0;
      }
    }
    if (/down|up|click/.test(e.type)) r.ua = ua();
    emit(r);
  }
  function key(e) {
    const r = base(e);
    Object.assign(r, { k: e.key, c: e.code, kc: e.keyCode, wh: e.which, cc: e.charCode, l: e.location, r: e.repeat ? 1 : 0, ic: e.isComposing ? 1 : 0, m: mods(e),
      nl: e.getModifierState && e.getModifierState("NumLock") ? 1 : 0, cl: e.getModifierState && e.getModifierState("CapsLock") ? 1 : 0, ua: ua() });
    emit(r);
  }
  function wheel(e) {
    const r = base(e);
    Object.assign(r, { dx: r3(e.deltaX), dy: r3(e.deltaY), dz: r3(e.deltaZ), dm: e.deltaMode, wdx: e.wheelDeltaX, wdy: e.wheelDeltaY, x: e.clientX, y: e.clientY,
      sx: e.screenX, sy: e.screenY, bs: e.buttons, m: mods(e) });
    emit(r);
  }
  function text(e) {
    const r = base(e);
    if ("inputType" in e) r.it = e.inputType;
    if ("data" in e) r.dt = e.data;
    if ("isComposing" in e) r.ic = e.isComposing ? 1 : 0;
    emit(r);
  }
  function focus(e) {
    const r = base(e);
    Object.assign(r, { rt: tid(e.relatedTarget), hf: document.hasFocus() ? 1 : 0, vs: document.visibilityState });
    emit(r);
  }
  function other(e) {
    const r = base(e);
    if (e.type === "scroll") Object.assign(r, { sy: Math.round(scrollY), sxx: Math.round(scrollX) });
    if (e.type === "visibilitychange" || e.type === "pagehide" || e.type === "pageshow") Object.assign(r, { hf: document.hasFocus() ? 1 : 0, vs: document.visibilityState });
    if (e.type === "change") r.v = e.target && "value" in e.target ? String(e.target.type === "checkbox" ? e.target.checked : e.target.value).slice(0, 40) : null;
    if (e.type === "resize") Object.assign(r, geometry());
    emit(r);
  }
  const opt = { capture: true, passive: true };
  for (const t of ["pointerover", "pointerenter", "pointerdown", "pointermove", "pointerrawupdate", "pointerup", "pointercancel", "pointerout", "pointerleave",
    "gotpointercapture", "lostpointercapture", "mouseover", "mouseenter", "mousemove", "mousedown", "mouseup", "click", "dblclick", "auxclick", "contextmenu",
    "mouseout", "mouseleave", "drag", "dragover"]) window.addEventListener(t, mouse, opt);
  for (const t of ["touchstart", "touchmove", "touchend", "touchcancel"]) window.addEventListener(t, other, opt);
  for (const t of ["keydown", "keypress", "keyup"]) window.addEventListener(t, key, opt);
  window.addEventListener("wheel", wheel, opt);
  for (const t of ["beforeinput", "input", "compositionstart", "compositionupdate", "compositionend"]) window.addEventListener(t, text, opt);
  for (const t of ["focus", "blur", "focusin", "focusout"]) window.addEventListener(t, focus, opt);
  for (const t of ["dragstart", "dragend", "drop", "change", "select", "resize", "pagehide", "pageshow"]) window.addEventListener(t, other, opt);
  document.addEventListener("visibilitychange", other, opt);
  document.addEventListener("scroll", other, opt);

  function geometry() {
    return { wx: window.screenX, wy: window.screenY, ow: outerWidth, oh: outerHeight, iw: innerWidth, ih: innerHeight, dpr: devicePixelRatio,
      sw: screen.width, sh: screen.height, saw: screen.availWidth, sah: screen.availHeight, sal: screen.availLeft, sat: screen.availTop };
  }
  // The smallest step of performance.now() over 20 ms (the clock's coarsening).
  function resolution() {
    let min = Infinity, last = performance.now();
    const end = last + 20;
    for (let n = 0; n < 1e6; n++) { const v = performance.now(); if (v > last) { min = Math.min(min, v - last); last = v; } if (v > end) break; }
    return r3(min);
  }
  function state(why) {
    const mm = (q) => matchMedia(q).matches;
    let top = null;
    try { top = window.top === window; } catch (e) { top = "error"; }
    emit({ f: FRAME, e: "state", why, t: now(), ...geometry(),
      pointer: ["fine", "coarse", "none"].find((v) => mm(`(pointer: ${v})`)) || null, anyPointer: ["fine", "coarse", "none"].filter((v) => mm(`(any-pointer: ${v})`)),
      hover: ["hover", "none"].find((v) => mm(`(hover: ${v})`)) || null, anyHover: ["hover", "none"].filter((v) => mm(`(any-hover: ${v})`)),
      mtp: navigator.maxTouchPoints, ontouch: "ontouchstart" in window, touchEvent: typeof TouchEvent, idc: typeof InputDeviceCapabilities,
      cd: screen.colorDepth, ori: screen.orientation ? screen.orientation.type : null, ext: screen.isExtended,
      vv: window.visualViewport ? [visualViewport.width, visualViewport.height, visualViewport.scale] : null,
      hf: document.hasFocus() ? 1 : 0, vs: document.visibilityState, wd: navigator.webdriver, sec: isSecureContext, coi: crossOriginIsolated,
      ua: navigator.userAgent, plat: navigator.platform, uad: navigator.userAgentData ? { mobile: navigator.userAgentData.mobile, platform: navigator.userAgentData.platform } : null,
      to: TO, origin: location.origin, top, anc: location.ancestorOrigins ? [...location.ancestorOrigins] : null, res: resolution(), uact: ua(),
      kbd: !!navigator.keyboard, rawupdate: "onpointerrawupdate" in window, coalesced: typeof PointerEvent !== "undefined" && "getCoalescedEvents" in PointerEvent.prototype,
      predicted: typeof PointerEvent !== "undefined" && "getPredictedEvents" in PointerEvent.prototype });
    if (navigator.keyboard && navigator.keyboard.getLayoutMap) {
      navigator.keyboard.getLayoutMap().then((m) => emit({ f: FRAME, e: "kbdmap", t: now(), ok: 1, n: m.size, KeyQ: m.get("KeyQ"), KeyY: m.get("KeyY"), KeyA: m.get("KeyA") }),
        (err) => emit({ f: FRAME, e: "kbdmap", t: now(), ok: 0, err: String((err && err.message) || err).slice(0, 160) }));
    }
  }
  return { state, now, E };
}
</script>

<script type="text/plain" id="box-ui">
// The box's own code (in the frame): records go to the parent page by postMessage, 20 times a second.
(function () {
  let q = [];
  const core = recCore("box", (r) => q.push(r));
  setInterval(() => { if (q.length) { parent.postMessage({ __rec: q }, "*"); q = []; } }, 50);
  addEventListener("pagehide", () => { if (q.length) parent.postMessage({ __rec: q }, "*"); });
  const cb = document.getElementById("cb");
  cb.addEventListener("change", () => {
    document.getElementById("lbl").style.display = cb.checked ? "none" : "";
    document.getElementById("ok").style.display = cb.checked ? "inline" : "none";
    q.push({ f: "box", e: "box-checked", t: core.now(), v: cb.checked ? 1 : 0 });
    parent.postMessage({ __box: cb.checked ? "checked" : "unchecked" }, "*");
  });
  addEventListener("message", (m) => {
    if (m.source !== parent || !m.data) return;
    if (m.data.cmd === "reset") { cb.checked = false; document.getElementById("lbl").style.display = ""; document.getElementById("ok").style.display = "none"; }
    if (m.data.cmd === "state") core.state(m.data.why || "asked");
  });
  // What the box can know of its own place on the screen: IntersectionObserver v2 (isVisible: not covered, not faded).
  try {
    new IntersectionObserver((es) => { for (const x of es) q.push({ f: "box", e: "io", t: core.now(), hit: x.isIntersecting ? 1 : 0, vis: x.isVisible === undefined ? null : x.isVisible ? 1 : 0,
      ratio: Math.round(x.intersectionRatio * 1000) / 1000, rb: x.rootBounds ? 1 : 0 }); }, { trackVisibility: true, delay: 100, threshold: [0, 1] }).observe(document.body);
  } catch (e) { q.push({ f: "box", e: "io", t: core.now(), err: String(e.message || e).slice(0, 120) }); }
  core.state("load");
})();
</script>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const SINK = params.get("sink") === "1";
  const ALL = [], FRAMES = [];
  let pending = [];
  const emit = (r) => { ALL.push(r); if (SINK) pending.push(r); };
  const core = recCore("top", emit);
  const $ = (id) => document.getElementById(id);
  const say = (s) => { $("status").textContent = s; };

  // ---------- the box frame ----------
  const box = $("box");
  const boxSrc = $("box-html").innerHTML + "<script>" + $("core").textContent + "<\/script><script>" + $("box-ui").textContent + "<\/script>";
  const boxUrl = params.get("box");
  if (boxUrl) { box.removeAttribute("sandbox"); box.src = boxUrl; } else box.srcdoc = "<!doctype html><html><head><meta charset=utf-8></head><body>" + boxSrc + "</body></html>";
  let onBox = null;
  addEventListener("message", (m) => {
    if (m.source !== box.contentWindow || !m.data) return;
    if (Array.isArray(m.data.__rec)) for (const r of m.data.__rec) emit(r);
    if (m.data.__box && onBox) onBox(m.data.__box);
  });

  // ---------- frames, the layout, the sink ----------
  const loop = (ts) => { FRAMES.push(core.E(ts)); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  const rect = (el) => { const r = el.getBoundingClientRect(); return [Math.round(r.left * 100) / 100, Math.round(r.top * 100) / 100, Math.round(r.width * 100) / 100, Math.round(r.height * 100) / 100]; };
  function layout(why) {
    const r = {};
    for (const id of ["f", "ta", "b", "hov", "chk", "sel", "file", "drag", "drop", "box", "stage", "far", "start", "topbtn"]) { const el = $(id); if (el) r[id] = rect(el); }
    const tg = document.querySelector(".tgt"); if (tg) r.tgt = rect(tg);
    emit({ f: "top", e: "layout", why, t: core.now(), sy: Math.round(scrollY), ih: innerHeight, r });
  }
  let scrollT = 0;
  addEventListener("scroll", () => { clearTimeout(scrollT); scrollT = setTimeout(() => layout("scroll"), 120); }, { passive: true });
  addEventListener("resize", () => layout("resize"));
  if (SINK) {
    // The probe only: no native context menu at a right click (it would take the X input of the probe's display).
    addEventListener("contextmenu", (e) => e.preventDefault());
    let seq = 0;
    const run = params.get("run");
    const flush = () => {
      if (FRAMES.length) { pending.push({ f: "top", e: "frames", list: FRAMES.splice(0) }); }
      while (pending.length) {
        let n = pending.length, body;
        const mark = { f: "top", e: "seq", n: seq, run, t: core.now() };
        while ((body = JSON.stringify([mark, ...pending.slice(0, n)])).length > 60000 && n > 1) n = Math.ceil(n / 2);
        navigator.sendBeacon("/log", body);
        seq++;
        pending = pending.slice(n);
      }
    };
    setInterval(flush, 250);
    addEventListener("pagehide", flush);
  }
  addEventListener("load", () => { core.state("load"); layout("load"); });
  window.__recorder = { layout, state: () => { core.state("asked"); box.contentWindow.postMessage({ cmd: "state", why: "asked" }, "*"); } };

  // ---------- the tasks of part B ----------
  const stage = $("stage"), instr = $("instr");
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const rnd = (a, b) => a + Math.random() * (b - a);
  let busy = false;
  const mark = (what, extra) => emit({ f: "top", e: "task", what, t: core.now(), ...extra });
  const once = (el, type, test) => new Promise((res) => { const f = (e) => { if (!test || test(e)) { el.removeEventListener(type, f); res(e); } }; el.addEventListener(type, f); });
  const home = { left: "480px", top: "96px" };
  const putBox = (x, y) => { box.style.left = 40 + x + "px"; box.style.top = 420 + y + "px"; };
  const boxHome = () => { box.style.left = home.left; box.style.top = home.top; box.contentWindow.postMessage({ cmd: "reset" }, "*"); };
  const button = (id, label, x, y) => {
    const b = document.createElement("button"); b.id = id; b.textContent = label;
    Object.assign(b.style, { position: "absolute", left: x + "px", top: y + "px", width: "110px", height: "36px" });
    stage.appendChild(b); return b;
  };
  async function run(name, fn) {
    if (busy) return;
    busy = true;
    mark("begin", { task: name, device: $("dev").value });
    say(`Task ${name} running.`);
    try { await fn(); } finally {
      mark("end", { task: name });
      for (const el of [...stage.querySelectorAll("button, .tgt"), ...document.querySelectorAll("body > #start")]) el.remove();
      instr.textContent = ""; boxHome(); busy = false;
      say(`Task ${name} done. Run the next task, or press "Save JSON".`);
    }
  }
  // 1: click the box, 10 times: Start, then the box at a new place.
  $("t1").onclick = () => run("1-clickbox", async () => {
    for (let i = 0; i < 10; i++) {
      instr.textContent = `Click box ${i + 1} of 10: click "Start", then tick the box's square as you would on a web site.`;
      box.style.left = "-1000px";
      const sx = rnd(20, 760), sy = rnd(260, 350), s = button("start", "Start", sx, sy);
      await once(s, "click"); s.remove();
      let bx, by;
      do { bx = rnd(10, 590); by = rnd(60, 320); } while (Math.hypot(bx - sx, by - sy) < 250);
      putBox(bx, by); layout("trial");
      mark("trial", { task: "1-clickbox", n: i, start: [sx, sy], box: [bx, by] });
      await new Promise((res) => { onBox = (v) => { if (v === "checked") { onBox = null; res(); } }; });
      await sleep(600);
      box.contentWindow.postMessage({ cmd: "reset" }, "*");
    }
  });
  // 2: click 20 round targets of different sizes.
  $("t2").onclick = () => run("2-targets", async () => {
    for (let i = 0; i < 20; i++) {
      instr.textContent = `Target ${i + 1} of 20: click the blue dot.`;
      const d = [16, 24, 32, 48, 64][i % 5], t = document.createElement("div");
      t.className = "tgt"; Object.assign(t.style, { width: d + "px", height: d + "px", left: rnd(10, 880 - d) + "px", top: rnd(50, 390 - d) + "px" });
      stage.appendChild(t); layout("trial");
      mark("trial", { task: "2-targets", n: i, size: d });
      await once(t, "click"); t.remove();
    }
  });
  // 3: type three lines into the text field; Enter ends each line.
  const LINES = ["The quick brown fox jumps over the lazy dog.", "Meet me at 10:45 on Friday, OK?", "jane.doe@example.com"];
  $("t3").onclick = () => run("3-typing", async () => {
    for (let i = 0; i < LINES.length; i++) {
      instr.innerHTML = `Line ${i + 1} of 3: click the text field, type <span class="sent"></span> as you normally type (fix mistakes as you normally do), then press Enter.`;
      instr.querySelector(".sent").textContent = LINES[i];
      $("f").value = "";
      mark("trial", { task: "3-typing", n: i, want: LINES[i] });
      await once($("f"), "keydown", (e) => e.key === "Enter");
      mark("typed", { n: i, got: $("f").value });
      await sleep(100); $("f").value = "";
    }
  });
  // 4: scroll down to the far button, click it, scroll back up, click "Back at top"; twice.
  $("t4").onclick = () => run("4-scroll", async () => {
    for (let i = 0; i < 2; i++) {
      instr.textContent = `Round ${i + 1} of 2: scroll down to "Far button" (with the wheel or the trackpad) and click it.`;
      mark("trial", { task: "4-scroll", n: i, leg: "down" });
      await once($("far"), "click");
      instr.textContent = `Round ${i + 1} of 2: now scroll back up and click "Back at top".`;
      const b = button("topbtn", "Back at top", 400, 200);
      mark("trial", { task: "4-scroll", n: i, leg: "up" });
      await once(b, "click"); b.remove();
    }
  });
  // 5: reach the box with the keyboard: Tab until its square has the focus, then Space; twice.
  // The Start button sits just before the box in the page's order, beside it, and takes the focus at its click (a click
  // does not focus a button on every platform): one Tab then reaches the box's square.
  $("t5").onclick = () => run("5-keys-to-box", async () => {
    for (let i = 0; i < 2; i++) {
      instr.textContent = `Round ${i + 1} of 2: click "Start" (right of the box), press Tab once: the box's square shows a focus ring. Then press Space. If the ring is not on the square, press Tab again; if Tab never reaches it, stop and go to task 6.`;
      const s = button("start", "Start", 0, 0);
      Object.assign(s.style, { left: "800px", top: "110px" });
      document.body.insertBefore(s, box);
      await once(s, "click");
      s.focus();
      mark("trial", { task: "5-keys-to-box", n: i });
      await new Promise((res) => { onBox = (v) => { if (v === "checked") { onBox = null; res(); } }; });
      s.remove(); await sleep(600); box.contentWindow.postMessage({ cmd: "reset" }, "*");
    }
  });
  // 6: rest: the hand on the device, still, for 10 s.
  $("t6").onclick = () => run("6-rest", async () => {
    for (let s = 10; s > 0; s--) { instr.textContent = `Keep your hand on the mouse or trackpad and keep still: ${s} s.`; await sleep(1000); }
  });
  // 7: switch to another app or tab, come back, click the Button.
  $("t7").onclick = () => run("7-switch", async () => {
    instr.textContent = "Switch to another app or tab (as you normally do), wait about 3 s, come back, then click \"Button\" (top left).";
    await once(window, "blur");
    await once($("b"), "click");
  });
  $("save").onclick = () => {
    core.state("save"); layout("save");
    setTimeout(() => {
      const data = { what: "ab-t30.1 input recording", saved: new Date().toISOString(), device: $("dev").value, url: location.href.split("?")[0].split("/").pop(),
        records: ALL, frames: FRAMES };
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
      a.download = `input-recording-${$("dev").value || "device"}-${data.saved.replace(/[:.]/g, "-")}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      say(`Saved ${ALL.length} records as ${a.download}.`);
    }, 300);
  };
})();
</script>
</body>
</html>
